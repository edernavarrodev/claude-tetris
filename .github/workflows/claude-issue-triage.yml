name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Issue Triage
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Analiza el issue #${{ github.event.issue.number }} de este repositorio (Tetris en HTML/CSS/JS
            vanilla, sin dependencias ni build; ver CLAUDE.md para la arquitectura de game.js).

            1. Lee el issue (título y cuerpo) y compáralo contra el código actual (index.html, style.css,
               game.js) para diagnosticar de qué se trata: bug, enhancement, question, documentation o
               duplicate. Si es un bug, intenta ubicar la función o línea responsable.
            2. Asigna la(s) label(s) que correspondan usando únicamente las labels default ya existentes
               en el repo: bug, enhancement, question, documentation, duplicate, invalid, wontfix,
               good first issue, help wanted. Usa `gh issue edit ${{ github.event.issue.number }} --add-label "<label>"`.
               No crees labels nuevas.
            3. Publica un comentario de diagnóstico en el issue con
               `gh issue comment ${{ github.event.issue.number }} --body "..."`, en español, en Markdown
               válido para GitHub, con esta estructura:
               - `### Diagnóstico` — resumen de 1-2 líneas de qué es el issue.
               - `### Causa probable` — si aplica, referencia `archivo.js:línea` o función involucrada.
               - `### Severidad` — baja/media/alta con una razón breve.
               - `### Próximos pasos` — lista corta de qué haría falta para resolverlo.
               Si el issue es una pregunta o falta información para diagnosticar, dilo explícitamente en
               vez de inventar una causa.

          claude_args: |
            --allowedTools "Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Read,Grep,Glob"
